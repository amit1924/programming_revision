  - heading "6. Cheat Sheet" [level=2] [ref=e253]:
    - generic [ref=e254]: 6. Cheat Sheet
  - code [ref=e256]: // String → Array str.split(",") // → ["a","b","c"] by delimiter str.split("") // → ["h","e","l","l","o"] chars (NOT unicode-safe) Array.from(str) // → ["h","e","l","l","o"] (unicode-safe) [...str] // → ["h","e","l","l","o"] (unicode-safe) str.split("").reverse().join("") // → "olleh" reverse a string // Array → String arr.join(",") // → "a,b,c" arr.join("") // → "abc" concatenate arr.toString() // → "a,b,c" String(arr) // → "a,b,c" "" + arr // → "a,b,c" implicit coercion // Convert each element arr.map(x => String(x)) // → ["1","2","3"] str.split(",").map(Number) // → [1,2,3] parse numbers // Multi-char separator "a||b||c".split("||") // → ["a","b","c"] ["a","b"].join(" || ") // → "a || b"