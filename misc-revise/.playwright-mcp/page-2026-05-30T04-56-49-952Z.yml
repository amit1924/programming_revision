  - paragraph [ref=e91]:
    - text: The
    - strong [ref=e92]: Poll
    - text: "phase is the most important: it retrieves new I/O events, executes their callbacks, and decides what to do next. libuv uses platform-specific polling mechanisms (epoll on Linux, kqueue on macOS, IOCP on Windows)."
  - generic [ref=e93]:
    - generic [ref=e94]:
      - generic [ref=e95]: "📥 Poll step 1: Calculate timeout"
      - generic [ref=e96]:
        - text: Looks at the earliest timer. If timers are pending, poll timeout = 0 (don't block). If
        - code [ref=e97]: setImmediate
        - text: is pending, timeout = 0. Otherwise, no pending timers or check → block indefinitely.
    - generic [ref=e98]:
      - generic [ref=e99]: "📡 Poll step 2: Watch for I/O"
      - generic [ref=e100]: libuv blocks waiting for I/O events (socket data, file reads, etc.) up to the calculated timeout. New events are queued as callbacks in the poll queue.
    - generic [ref=e101]:
      - generic [ref=e102]: "⚡ Poll step 3: Execute callbacks"
      - generic [ref=e103]:
        - text: Runs all I/O callbacks in the poll queue (up to a system limit). After each callback, the
        - code [ref=e104]: process.nextTick
        - text: + microtask queues are drained.
    - generic [ref=e105]:
      - generic [ref=e106]: "🔀 Poll step 4: Check for next phase"
      - generic [ref=e107]:
        - text: After the poll queue is empty (or hits the limit), if
        - code [ref=e108]: setImmediate
        - text: callbacks are pending → proceeds to Check phase. If timers are due → loops back to Timers.
  - code [ref=e110]: "// Pseudocode: Poll phase decision if (pendingTimers.length > 0 || pendingImmediates.length > 0) { timeout = 0; // don't block, check immediately } else if (no I/O watchers) { timeout = 0; // nothing to wait for } else { timeout = nextTimer - now; // block until next timer } events = poll(timeout); // blocking call (epoll/kqueue/IOCP) runCallbacks(events); // execute I/O callbacks // After each callback: drain nextTick, drain microtasks"
