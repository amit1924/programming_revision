    - heading "Arrays in Excel" [level=1] [ref=e14]
    - paragraph [ref=e15]: An array is a collection of values treated as one thing. An array formula performs calculations across that collection — typing a formula in a single cell lets it fill the cells below or beside it, or collapse a whole range into one number. Modern Excel does this with dynamic arrays (just press Enter); older workbooks used legacy CSE (Ctrl+Shift+Enter).
