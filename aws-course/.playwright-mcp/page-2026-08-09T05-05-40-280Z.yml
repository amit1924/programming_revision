        - heading " Why Containers?" [level=2] [ref=e80]:
          - generic [ref=e81]: 
          - text: Why Containers?
        - paragraph [ref=e83]:
          - text: On an EC2 VM, your app sits inside a full operating system. A container is different — it's a
          - strong [ref=e84]: package containing your code and everything it needs to run
          - text: (runtime, libraries, config), sharing the host's OS kernel. Same app, same behavior, everywhere.
        - generic [ref=e85]:
          - generic [ref=e86]:
            - generic [ref=e87]: 
            - text: VM vs Container
          - generic [ref=e88]: "VIRTUAL MACHINE: CONTAINER: ┌───────────────┐ ┌─────────────┐ │ your app │ │ your app │ ← only the app │ libs+binaries│ │ libs │ + its deps │ GUEST OS │ heavy │ │ ← shares host OS ├───────────────┤ └─────────────┘ │ HYPERVISOR │ ┌─────────────┐ └───────────────┘ │ HOST OS │ ← one kernel Whole OS per app ⚠️ │ kernel │ shared by all └─────────────┘ slow to boot · big tiny · boots in ms · portable"
        - generic [ref=e89]:
          - generic [ref=e90]: 📦
          - generic [ref=e91]:
            - generic [ref=e92]: Image = recipe, Container = running dish
            - paragraph [ref=e93]:
              - text: A
              - strong [ref=e94]: Docker image
              - text: is a read-only file that describes your app (like a recipe or a blueprint). A
              - strong [ref=e95]: container
              - text: is one running instance of that image. You can run 1 container or 100 from the same image — identical every time. That's the "works on my machine" problem, solved forever.
        - generic [ref=e96]:
          - generic [ref=e97]: 
          - generic [ref=e99]:
            - generic [ref=e100]: Why do cloud teams love this?
            - text: Same image runs on a laptop, a test server, and 10,000 production servers. Deployments are fast (start/stop containers instead of booting OSes), and apps are isolated — one crashing container doesn't take down its neighbors. ECS just runs these images for you in the cloud.
