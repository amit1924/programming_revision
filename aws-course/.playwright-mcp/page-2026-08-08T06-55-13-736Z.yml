          - code [ref=f4e663]: "# 1. Create the hosted zone (grab the ID from the output) awslocal route53 create-hosted-zone --name amit.com --caller-reference ref-001 ZONE_ID=$(awslocal route53 list-hosted-zones --query \"HostedZones[0].Id\" --output text | sed 's|/hostedzone/||') # 2. See the auto-created NS + SOA records awslocal route53 list-resource-record-sets --hosted-zone-id \"$ZONE_ID\" # 3. Add an A record: www.amit.com → 1.2.3.4 awslocal route53 change-resource-record-sets --hosted-zone-id \"$ZONE_ID\" --change-batch '{\"Changes\":[{\"Action\":\"UPSERT\",\"ResourceRecordSet\":{\"Name\":\"www.amit.com\",\"Type\":\"A\",\"TTL\":300,\"ResourceRecords\":[{\"Value\":\"1.2.3.4\"}]}}]}' # 4. Add a CNAME alias: blog.amit.com → www.amit.com awslocal route53 change-resource-record-sets --hosted-zone-id \"$ZONE_ID\" --change-batch '{\"Changes\":[{\"Action\":\"UPSERT\",\"ResourceRecordSet\":{\"Name\":\"blog.amit.com\",\"Type\":\"CNAME\",\"TTL\":300,\"ResourceRecords\":[{\"Value\":\"www.amit.com\"}]}}]}' # 5. Weighted routing: 80% primary, 20% backup (same name, SetIdentifier each) awslocal route53 change-resource-record-sets --hosted-zone-id \"$ZONE_ID\" --change-batch '{\"Changes\":[{\"Action\":\"UPSERT\",\"ResourceRecordSet\":{\"Name\":\"www.amit.com\",\"Type\":\"A\",\"SetIdentifier\":\"primary\",\"Weight\":80,\"TTL\":300,\"ResourceRecords\":[{\"Value\":\"10.0.1.15\"}]}},{\"Action\":\"UPSERT\",\"ResourceRecordSet\":{\"Name\":\"www.amit.com\",\"Type\":\"A\",\"SetIdentifier\":\"backup\",\"Weight\":20,\"TTL\":300,\"ResourceRecords\":[{\"Value\":\"10.0.1.16\"}]}}]}' # 6. Health check: probe www.amit.com every 30s awslocal route53 create-health-check --caller-reference hc-001 --health-check-config '{\"Type\":\"HTTP\",\"FullyQualifiedDomainName\":\"www.amit.com\",\"Port\":80,\"ResourcePath\":\"/\",\"RequestInterval\":30}' # 7. Clean up (records before zone!) awslocal route53 delete-health-check --health-check-id <hc-id> awslocal route53 change-resource-record-sets --hosted-zone-id \"$ZONE_ID\" --change-batch '{\"Changes\":[{\"Action\":\"DELETE\",\"ResourceRecordSet\":{\"Name\":\"www.amit.com\",\"Type\":\"A\",\"TTL\":300,\"ResourceRecords\":[{\"Value\":\"1.2.3.4\"}]}}]}' awslocal route53 delete-hosted-zone --id \"$ZONE_ID\""
