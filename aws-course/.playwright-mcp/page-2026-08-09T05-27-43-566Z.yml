          - generic [ref=f2e78]: 
          - text: Why Serverless?
        - paragraph [ref=f2e80]:
          - text: With EC2 you rent servers. With ECS you rent containers running on servers. With
          - strong [ref=f2e81]: serverless
          - text: you rent
          - emphasis [ref=f2e82]: executions
          - text: "— you never think about servers at all. The \"server\" is invisible: AWS runs your code on demand and disappears when done."
        - generic [ref=f2e83]:
          - generic [ref=f2e84]:
            - generic [ref=f2e85]: 
            - text: The evolution of "where does my code run?"
          - generic [ref=f2e86]: EC2 rent a VM → you manage the OS (patch, secure, scale) ECS run containers → AWS runs them, you pick the size LAMBDA run a function → AWS runs it only when called 🔥 No EC2 → no servers to patch or secure No ECS cluster → nothing running when idle (pay $0) Still scales → 1 call or 1 million, AWS handles it
        - generic [ref=f2e87]:
          - generic [ref=f2e88]: ⚡
          - generic [ref=f2e89]:
            - generic [ref=f2e90]: Event-driven = code that only exists when needed
            - paragraph [ref=f2e91]:
              - text: Lambda runs your function in response to an
              - strong [ref=f2e92]: event
              - text: ": an S3 upload (Chapter 8), an HTTP request, a database change, a message in a queue. The function executes, returns a result, and its container goes away. Idle time costs nothing, and a traffic spike just means AWS starts more copies — automatically, in milliseconds."
        - generic [ref=f2e93]:
          - generic [ref=f2e94]: 
