        - heading " Why Containers?" [level=2] [ref=f1e34]:
          - generic [ref=f1e35]: 
          - text: Why Containers?
        - paragraph [ref=f1e37]:
          - text: On an EC2 VM, your app sits inside a full operating system. A container is different — it's a
          - strong [ref=f1e38]: package containing your code and everything it needs to run
          - text: (runtime, libraries, config), sharing the host's OS kernel. Same app, same behavior, everywhere.
        - generic [ref=f1e39]:
          - generic [ref=f1e40]:
            - generic [ref=f1e41]: 
            - text: VM vs Container
          - generic [ref=f1e42]: "VIRTUAL MACHINE: CONTAINER: ┌───────────────┐ ┌─────────────┐ │ your app │ │ your app │ ← only the app │ libs+binaries│ │ libs │ + its deps │ GUEST OS │ heavy │ │ ← shares host OS ├───────────────┤ └─────────────┘ │ HYPERVISOR │ ┌─────────────┐ └───────────────┘ │ HOST OS │ ← one kernel Whole OS per app ⚠️ │ kernel │ shared by all └─────────────┘ slow to boot · big tiny · boots in ms · portable"
        - generic [ref=f1e43]:
          - generic [ref=f1e44]: 📦
          - generic [ref=f1e45]:
            - generic [ref=f1e46]: Image = recipe, Container = running dish
            - paragraph [ref=f1e47]:
              - text: A
              - strong [ref=f1e48]: Docker image
              - text: is a read-only file that describes your app (like a recipe or a blueprint). A
              - strong [ref=f1e49]: container
              - text: is one running instance of that image. You can run 1 container or 100 from the same image — identical every time. That's the "works on my machine" problem, solved forever.
        - generic [ref=f1e50]:
          - generic [ref=f1e51]: 
          - generic [ref=f1e53]:
            - generic [ref=f1e54]: Why do cloud teams love this?
            - text: Same image runs on a laptop, a test server, and 10,000 production servers. Deployments are fast (start/stop containers instead of booting OSes), and apps are isolated — one crashing container doesn't take down its neighbors. ECS just runs these images for you in the cloud.
