        - paragraph [ref=f6e81]:
          - text: "Your EC2 server has a disk, your RDS database has tables. But websites need another kind of storage:"
          - strong [ref=f6e82]: files that don't change often and just need to be fetched
          - text: — product photos, user avatars, videos, backups, PDFs.
